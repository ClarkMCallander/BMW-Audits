<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wukong Auditor</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React as Global Variables (Bypasses import errors) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to translate JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-950">
    <!-- The app renders here -->
    <div id="root"></div>

    <!-- Our Application Code -->
    <script type="text/babel">
        // 1. Extract React Hooks from the Global Object
        const { useState, useMemo, useEffect } = window.React;

        // 2. Inline SVG Icons (Guarantees icons load without external dependencies)
        const IconCheckCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
        const IconMapPin = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconLeaf = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
        const IconBug = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>;
        const IconSparkles = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const IconHeart = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const IconZap = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>;
        const IconFlame = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const IconTrophy = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const IconFilter = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const IconMenu = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;

        // 3. --- COMPREHENSIVE GAME DATA: CH 1 & 2 ---
        const GAME_DATA = [
          {
            id: 'ch1',
            title: 'Chapter 1: Black Wind Mountain',
            items: [
              // Permanent Upgrades
              { id: 'c1_v1', type: 'Vine', name: 'Marsh of White Mist Vine', guide: 'Marsh of White Mist. Defeat the Whiteclad Noble. The vine is harvested from a glowing green tree right next to the Shen Monkey NPC.' },
              { id: 'c1_w1', type: 'Worm', name: 'Outside the Forest Worm', guide: 'Outside the Forest. Defeat the Bullguard boss. Walk into the cave directly behind his arena and smash the glowing pots in the back right corner.' },
              { id: 'c1_hp1', type: 'Health Pill', name: 'Celestial Jade Lotus Pill', guide: 'Marsh of White Mist. After defeating the Whiteclad Noble, look around the right side of the immediate boss arena area for a golden container before entering the cave.' },
              { id: 'c1_mp1', type: 'Mana Pill', name: 'Celestial Taiyi Pill', guide: 'Cave Interior. Accessible after defeating the Black Wind King. Explore the wooden platforms in the temple behind the arena to find the pill sitting on a wooden bench.' },
              { id: 'c1_sp1', type: 'Stamina Pill', name: 'Celestial Nonary Pill', guide: 'Outside the Cave. After the Black Wind King, continue up the hill towards Bodhi Peak. Once you fight through an ambush of enemies, look for a golden chest on the left.' },
              
              // Meditation Spots (3 in Ch 1)
              { id: 'c1_m1', type: 'Meditation', name: 'The Arbor', guide: 'Front Hills. Proceed forward through the wooden gate from the shrine. Look immediately to the cliffside on your left to find a small wooden structure with the cushion.' },
              { id: 'c1_m2', type: 'Meditation', name: 'The Cavern', guide: 'Cave Interior. From the shrine, progress slightly forward and look for an alcove on your left right before the Black Wind King boss arena.' },
              { id: 'c1_m3', type: 'Meditation', name: 'The Cliff', guide: 'Marsh of White Mist. Just past the Shen Monkey NPC, drop down to the lower wooden walkways and follow them to a cliff edge overlooking the water.' },
              
              // Transformations
              { id: 'c1_tr1', type: 'Transformation', name: 'Red Tides (Guangzhi)', guide: 'Outside the Forest. Take the left path from the shrine, cross the bridge, and defeat the fire-wielding wolf boss Guangzhi.' },
            ]
          },
          {
            id: 'ch2',
            title: 'Chapter 2: Yellow Wind Ridge',
            items: [
              // Permanent Upgrades
              { id: 'c2_v1', type: 'Vine', name: 'Windseal Gate Vine', guide: 'Windseal Gate. After defeating the Gore-Eye Daoist near the shrine, proceed through the gate. The vine is on a tree to your immediate right.' },
              { id: 'c2_v2', type: 'Vine', name: 'Yellow Wind Formation Vine', guide: 'Yellow Wind Formation. Near the bridge leading to the final areas of the formation, guarded by several rat archers. Harvest from the glowing tree.' },
              { id: 'c2_w1', type: 'Worm', name: 'Valley of Despair Worm', guide: 'Valley of Despair. Drop down into the ravine near the shrine. Found inside a glowing pot in a dead-end cave guarded by a few enemies.' },
              { id: 'c2_w2', type: 'Worm', name: 'Man-in-Stone Worm', guide: 'Squall Hideout. Complete the Man-in-Stone questline by bringing him Azure Dust, defeating him, and then purchasing the Awaken Wine Worm from his shop.' },
              { id: 'c2_hp1', type: 'Health Pill', name: 'Celestial Jade Lotus Pill', guide: 'Valley of Despair. Found in a chest near the area where you fight the King of Flowing Sands and his son.' },
              { id: 'c2_mp1', type: 'Mana Pill', name: 'Celestial Taiyi Pill', guide: 'Rock Clash Platform. Take the path opposite the shrine and defeat the Rat Governor Spirit. The pill is on a small side path branching off to the right before the Meditation Spot.' },
              { id: 'c2_sp1', type: 'Stamina Pill', name: 'Celestial Nonary Pill', guide: 'Valley of Despair. Opposite the arena where you fight the First Prince of Flowing Sands, find a wooden plank path leading to a crack in the wall. Squeeze through, defeat the Swift Bat, and find the pill at the back of the alcove.' },
              
              // Meditation Spots (6 in Ch 2)
              { id: 'c2_m1', type: 'Meditation', name: 'The Altar', guide: 'Village Entrance. Walk towards the village gate, take a path to the left near where you fight the Earth Wolf, and find the spot overlooking a cliff.' },
              { id: 'c2_m2', type: 'Meditation', name: 'The Ravine', guide: 'Rock Clash Platform. Near the shrine and the rocky outcropping where you use the Buddha Eyeballs.' },
              { id: 'c2_m3', type: 'Meditation', name: 'The Dead End', guide: 'Temple Cellar. After sliding down into the secret sand area beneath Crouching Tiger Temple, look for a small alcove/cave on your left.' },
              { id: 'c2_m4', type: 'Meditation', name: 'The Bottom', guide: 'Squall Hideout. Head down into the lower sandy ravine/gully area behind some rock formations.' },
              { id: 'c2_m5', type: 'Meditation', name: 'The Statue', guide: 'Kingdom of Sahali (Secret Area). Near the Sandgate Pass shrine within the secret area, located on a ledge overlooking the vast desert.' },
              { id: 'c2_m6', type: 'Meditation', name: 'The Track', guide: 'Windseal Gate. Progress slightly past the shrine; look to the right to find a meditative cushion sitting on a small elevated cliff.' },
              
              // Transformations
              { id: 'c2_tr1', type: 'Transformation', name: 'Azure Dust (Rockman)', guide: 'Squall Hideout. Defeat the Mother of Stones to get the Azure Dust, bring it to the Man-in-Stone, and defeat him in combat.' },
            ]
          }
        ];

        // 4. --- STYLING MAPPING ---
        const ITEM_TYPES = [
          { type: 'Meditation', icon: IconSparkles, color: 'text-cyan-400', bg: 'bg-cyan-950', border: 'border-cyan-800' },
          { type: 'Vine', icon: IconLeaf, color: 'text-emerald-400', bg: 'bg-emerald-950', border: 'border-emerald-800' },
          { type: 'Worm', icon: IconBug, color: 'text-amber-400', bg: 'bg-amber-950', border: 'border-amber-800' },
          { type: 'Health Pill', icon: IconHeart, color: 'text-rose-400', bg: 'bg-rose-950', border: 'border-rose-800' },
          { type: 'Mana Pill', icon: IconZap, color: 'text-blue-400', bg: 'bg-blue-950', border: 'border-blue-800' },
          { type: 'Stamina Pill', icon: IconFlame, color: 'text-orange-400', bg: 'bg-orange-950', border: 'border-orange-800' },
          { type: 'Transformation', icon: IconSparkles, color: 'text-indigo-400', bg: 'bg-indigo-950', border: 'border-indigo-800' },
        ];

        // 5. App Component
        function App() {
          const [completedItems, setCompletedItems] = useState(() => {
            try {
              const saved = localStorage.getItem('wukong_audit_save_v2');
              if (saved) {
                return new Set(JSON.parse(saved));
              }
            } catch (e) {
              console.error('Failed to load save data', e);
            }
            return new Set();
          });

          const [activeChapterId, setActiveChapterId] = useState(GAME_DATA[0].id);
          const [activeFilter, setActiveFilter] = useState('All');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          useEffect(() => {
            try {
              localStorage.setItem('wukong_audit_save_v2', JSON.stringify(Array.from(completedItems)));
            } catch (e) {
              console.error('Failed to save data', e);
            }
          }, [completedItems]);

          const toggleItem = (itemId) => {
            setCompletedItems(prev => {
              const next = new Set(prev);
              if (next.has(itemId)) {
                next.delete(itemId);
              } else {
                next.add(itemId);
              }
              return next;
            });
          };

          const totalItems = useMemo(() => GAME_DATA.reduce((acc, ch) => acc + ch.items.length, 0), []);
          const overallProgress = Math.round((completedItems.size / totalItems) * 100) || 0;

          const activeChapter = GAME_DATA.find(ch => ch.id === activeChapterId);
          const chapterProgress = useMemo(() => {
            const chapterTotal = activeChapter.items.length;
            const chapterCompleted = activeChapter.items.filter(item => completedItems.has(item.id)).length;
            return {
              completed: chapterCompleted,
              total: chapterTotal,
              percentage: Math.round((chapterCompleted / chapterTotal) * 100) || 0
            };
          }, [activeChapter, completedItems]);

          const filteredItems = useMemo(() => {
            if (activeFilter === 'All') return activeChapter.items;
            return activeChapter.items.filter(item => item.type === activeFilter);
          }, [activeChapter, activeFilter]);

          const uniqueTypesInChapter = useMemo(() => {
            const types = new Set(activeChapter.items.map(item => item.type));
            return ['All', ...Array.from(types)];
          }, [activeChapter]);

          return (
            <div className="flex h-screen bg-stone-950 text-stone-300 font-serif overflow-hidden">
              
              {isMobileMenuOpen && (
                <div 
                  className="fixed inset-0 bg-black/60 z-20 md:hidden" 
                  onClick={() => setIsMobileMenuOpen(false)}
                />
              )}

              <aside className={`
                fixed md:static inset-y-0 left-0 z-30 w-72 bg-stone-900 border-r border-amber-900/30
                transform transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none
                ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                flex flex-col
              `}>
                <div className="p-6 border-b border-amber-900/30">
                  <h1 className="text-xl font-bold text-amber-500 tracking-wide mb-2 uppercase flex items-center gap-2">
                    <IconTrophy className="w-5 h-5" />
                    The Destined One
                  </h1>
                  <p className="text-xs text-stone-400 mb-4">Deep Audit: Ch 1 & 2</p>
                  
                  <div className="space-y-1 bg-stone-950/50 p-3 rounded-lg border border-stone-800">
                    <div className="flex justify-between text-xs">
                      <span className="text-stone-400">Total Completion</span>
                      <span className="text-amber-500 font-bold">{overallProgress}%</span>
                    </div>
                    <div className="h-2 w-full bg-stone-800 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-gradient-to-r from-amber-700 to-amber-500 transition-all duration-500 ease-out"
                        style={{ width: `${overallProgress}%` }}
                      />
                    </div>
                    <div className="text-[10px] text-right text-stone-500 mt-1">
                      {completedItems.size} of {totalItems} items found
                    </div>
                  </div>
                </div>

                <nav className="flex-1 overflow-y-auto py-4">
                  <ul className="space-y-2 px-3">
                    {GAME_DATA.map((chapter) => {
                      const chCompleted = chapter.items.filter(i => completedItems.has(i.id)).length;
                      const chTotal = chapter.items.length;
                      const isDone = chCompleted === chTotal && chTotal > 0;

                      return (
                        <li key={chapter.id}>
                          <button
                            onClick={() => {
                              setActiveChapterId(chapter.id);
                              setActiveFilter('All');
                              setIsMobileMenuOpen(false);
                            }}
                            className={`w-full text-left px-4 py-4 rounded-xl transition-all duration-200 flex flex-col gap-2
                              ${activeChapterId === chapter.id 
                                ? 'bg-stone-800 border border-amber-900/50 shadow-inner' 
                                : 'hover:bg-stone-800/50 border border-transparent'}
                            `}
                          >
                            <div className="flex justify-between items-center w-full">
                              <span className={`text-sm tracking-wide ${activeChapterId === chapter.id ? 'text-amber-400 font-bold' : 'text-stone-300'}`}>
                                {chapter.title}
                              </span>
                              {isDone && <IconCheckCircle className="w-5 h-5 text-emerald-500 drop-shadow-[0_0_5px_rgba(16,185,129,0.5)]" />}
                            </div>
                            <div className="flex items-center gap-2 w-full">
                              <div className="flex-1 h-1.5 bg-stone-900 rounded-full overflow-hidden">
                                 <div 
                                  className={`h-full transition-all duration-500 ${isDone ? 'bg-emerald-600' : 'bg-amber-600'}`}
                                  style={{ width: `${(chCompleted / chTotal) * 100}%` }}
                                />
                              </div>
                              <span className="text-xs text-stone-400 font-mono">{chCompleted}/{chTotal}</span>
                            </div>
                          </button>
                        </li>
                      );
                    })}
                  </ul>
                </nav>
              </aside>

              <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                
                <header className="bg-stone-900/90 backdrop-blur-md border-b border-amber-900/30 p-4 md:px-8 flex items-center justify-between sticky top-0 z-10">
                  <div className="flex items-center gap-4">
                    <button 
                      className="md:hidden p-2 -ml-2 text-stone-400 hover:text-amber-500 transition-colors"
                      onClick={() => setIsMobileMenuOpen(true)}
                    >
                      <IconMenu className="w-6 h-6" />
                    </button>
                    <div>
                      <h2 className="text-xl md:text-2xl font-bold text-stone-100 tracking-wide">{activeChapter.title}</h2>
                      <div className="flex items-center gap-3 text-xs md:text-sm text-stone-400 mt-1">
                        <span>Completed: {chapterProgress.completed} / {chapterProgress.total}</span>
                        <span className="text-stone-600">|</span>
                        <span className={`font-medium ${chapterProgress.percentage === 100 ? 'text-emerald-400' : 'text-amber-500'}`}>
                          {chapterProgress.percentage}%
                        </span>
                      </div>
                    </div>
                  </div>
                </header>

                <div className="px-4 md:px-8 py-4 flex flex-wrap gap-2 border-b border-stone-800/50 bg-stone-950/50">
                  <div className="flex items-center gap-2 mr-2 text-stone-400 text-sm font-medium">
                    <IconFilter className="w-4 h-4" /> Filter By:
                  </div>
                  {uniqueTypesInChapter.map(type => {
                    const isSelected = activeFilter === type;
                    const typeStyle = ITEM_TYPES.find(t => t.type === type) || ITEM_TYPES[0];
                    const IconComp = type !== 'All' ? typeStyle.icon : null;
                    
                    return (
                      <button
                        key={type}
                        onClick={() => setActiveFilter(type)}
                        className={`px-3 py-1.5 rounded-full text-xs transition-all duration-200 border flex items-center gap-1.5
                          ${isSelected 
                            ? `bg-stone-800 ${typeStyle.border} ${typeStyle.color} shadow-sm` 
                            : 'bg-stone-900 border-stone-800 text-stone-400 hover:border-stone-600 hover:text-stone-200'
                          }
                        `}
                      >
                        {IconComp && <IconComp className="w-3 h-3" />}
                        {type}
                      </button>
                    );
                  })}
                </div>

                <div className="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
                  <div className="max-w-4xl mx-auto space-y-4 pb-20">
                    {filteredItems.map(item => {
                      const isCompleted = completedItems.has(item.id);
                      const typeStyle = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];
                      const Icon = typeStyle.icon;

                      return (
                        <div 
                          key={item.id}
                          onClick={() => toggleItem(item.id)}
                          className={`
                            group relative flex gap-4 p-4 md:p-5 rounded-xl border transition-all duration-300 cursor-pointer overflow-hidden
                            ${isCompleted 
                              ? 'bg-stone-900/30 border-stone-800/50 opacity-50 hover:opacity-80' 
                              : 'bg-stone-900 border-stone-700 hover:border-amber-700/60 shadow-lg hover:shadow-amber-900/10'
                            }
                          `}
                        >
                          <div className="pt-1 flex-shrink-0 z-10">
                            {isCompleted ? (
                              <IconCheckCircle className="w-7 h-7 text-emerald-500 transition-colors drop-shadow-sm" />
                            ) : (
                              <IconCircle className="w-7 h-7 text-stone-600 group-hover:text-amber-500 transition-colors" />
                            )}
                          </div>

                          <div className="flex-1 z-10">
                            <div className="flex flex-col md:flex-row md:items-center gap-3 mb-2.5">
                              <h3 className={`text-lg font-bold transition-colors tracking-wide
                                ${isCompleted ? 'text-stone-500 line-through decoration-stone-600' : 'text-stone-100 group-hover:text-amber-400'}
                              `}>
                                {item.name}
                              </h3>
                              
                              <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] uppercase font-bold border tracking-wider self-start md:self-auto
                                ${isCompleted ? 'bg-stone-900 text-stone-600 border-stone-800' : `${typeStyle.bg} ${typeStyle.color} ${typeStyle.border}`}
                              `}>
                                <Icon className="w-3 h-3" />
                                {item.type}
                              </span>
                            </div>
                            
                            <p className={`text-sm leading-relaxed flex gap-2.5 items-start 
                              ${isCompleted ? 'text-stone-600' : 'text-stone-400'}
                            `}>
                              <IconMapPin className="w-4 h-4 mt-0.5 flex-shrink-0 opacity-60" />
                              <span>{item.guide}</span>
                            </p>
                          </div>
                          
                          {!isCompleted && (
                            <div className="absolute inset-0 bg-gradient-to-r from-amber-500/0 via-amber-500/0 to-amber-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none" />
                          )}
                        </div>
                      );
                    })}
                    
                    {filteredItems.length === 0 && (
                      <div className="text-center py-16 text-stone-500 border border-dashed border-stone-800 rounded-xl bg-stone-900/30">
                        <IconSparkles className="w-8 h-8 mx-auto mb-3 opacity-20" />
                        <p>No items found for the selected filter.</p>
                      </div>
                    )}
                  </div>
                </div>
              </main>
            </div>
          );
        }

        // 6. Render the app using the Global ReactDOM variable
        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
